name: ci

# 1. test            lint and the full test suite against real PostgreSQL (pgvector) and Redis Stack
# 2. retrieval-eval  real embedding and reranker models on the golden set; fails on any access leak
# 3. quality-gate    the agent end to end, scored with Ragas; fails below the thresholds.
#                    Needs the LLM_API_KEY secret (a free Groq key works). Without it the job is skipped
#                    with a notice, so forks and first runs still go green on the parts that need no key.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sample:
        description: "Golden cases for the quality gate (0 = all)"
        default: "24"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  DATABASE_URL: postgresql://rag:rag@localhost:5432/rag
  REDIS_URL: redis://localhost:6379/0
  # Throwaway credentials for the CI-only database, not secrets.
  SQL_READER_PASSWORD: rag_reader
  SQL_TOOL_DATABASE_URL: postgresql://rag_reader:rag_reader@localhost:5432/rag

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: rag, POSTGRES_PASSWORD: rag, POSTGRES_DB: rag_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis/redis-stack-server:7.4.0-v3
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://rag:rag@localhost:5432/rag_test
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_REDIS_STACK_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  retrieval-eval:
    needs: test
    runs-on: ubuntu-latest
    services: &services
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: rag, POSTGRES_PASSWORD: rag, POSTGRES_DB: rag }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis/redis-stack-server:7.4.0-v3
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('.env.example') }}
      - name: Install with CPU torch
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[ml]"
      - name: Database, sales seed and corpus
        run: |
          alembic upgrade head
          python -m scripts.seed_sales
          python -m scripts.ingest_examples
      - name: Retrieval evaluation
        run: python -m ml_pipeline.evaluate_rag retrieval --gate | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: retrieval-eval, path: reports/ }

  quality-gate:
    needs: retrieval-eval
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services: *services
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.groq.com/openai/v1' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'llama-3.3-70b-versatile' }}
      LLM_GRADER_MODEL: ${{ vars.LLM_GRADER_MODEL || 'llama-3.1-8b-instant' }}
      # Optional separate judge (for example a second free provider); defaults to the app's model.
      EVAL_JUDGE_API_KEY: ${{ secrets.EVAL_JUDGE_API_KEY }}
      EVAL_JUDGE_BASE_URL: ${{ vars.EVAL_JUDGE_BASE_URL }}
      EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL }}
      EVAL_WORKERS: "1"
      SAMPLE: ${{ github.event.inputs.sample || '24' }}
    steps:
      - name: Check for an LLM key
        id: key
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::notice::LLM_API_KEY is not set, so the Ragas quality gate was skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-python@v5
        if: steps.key.outputs.present == 'true'
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - uses: actions/cache@v4
        if: steps.key.outputs.present == 'true'
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('.env.example') }}
      - name: Install with CPU torch
        if: steps.key.outputs.present == 'true'
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[ml]"
      - name: Database, sales seed and corpus
        if: steps.key.outputs.present == 'true'
        run: |
          alembic upgrade head
          python -m scripts.seed_sales
          python -m scripts.ingest_examples
      - name: End-to-end evaluation and gate
        if: steps.key.outputs.present == 'true'
        run: |
          args="--gate"
          if [ "$SAMPLE" != "0" ]; then args="$args --sample $SAMPLE"; fi
          python -m ml_pipeline.evaluate_rag end-to-end $args | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outputs.present == 'true'
        with: { name: end-to-end-eval, path: reports/ }
