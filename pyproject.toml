[project]
name = "enterprise-rag-engine"
version = "1.0.0"
description = "Agentic RAG over documents and SQL data with hybrid search, reranking, access control and an evaluation gate"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "alembic>=1.14",
    "redis>=5.2",
    "celery>=5.4",
    "langgraph>=0.2.60",
    "openai>=1.55",
    "numpy>=1.26",
    "tiktoken>=0.8",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "sqlglot>=25",
    "psycopg[binary]>=3.2",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
]

[project.optional-dependencies]
# Local embedding and reranking models. Kept separate because torch is large.
models = ["sentence-transformers>=3.3", "torch>=2.4"]
ml = ["sentence-transformers>=3.3", "torch>=2.4", "datasets>=3.1", "ragas>=0.2.6", "langchain-openai>=0.2",
      "psycopg[binary]>=3.2"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.8", "psycopg[binary]>=3.2", "pypdf>=5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Arabic text in prompts and messages

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
